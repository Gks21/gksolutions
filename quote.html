<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Request a quote from GK Solutions — websites, custom software, network projects, and enterprise services." />
  <meta name="theme-color" content="#232323" />
  <title>Request a Quote — GK Solutions</title>
  <link rel="icon" href="img/gks_favicon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="quote">
  <div id="site-header"></div>

  <main id="main-content">
    <section class="page-hero">
      <div class="page-hero-bg" aria-hidden="true"></div>
      <div class="container">
        <p class="section-eyebrow">Request a Quote</p>
        <h1 class="page-title">Projects that need a custom estimate</h1>
        <p class="page-lead">Use this form for services that cannot reasonably be priced instantly — websites, custom software, network projects, and more.</p>
      </div>
    </section>

    <section class="page-content">
      <div class="container content-narrow">
        <form class="contact-form" id="quote-form">
          <input type="text" name="_gotcha" class="honeypot" tabindex="-1" autocomplete="off" aria-hidden="true" />
          <input type="hidden" name="_form_kind" value="quote" />

          <div class="form-row">
            <div class="form-group">
              <label for="quote-name">Name</label>
              <input type="text" id="quote-name" name="name" required placeholder="Your name" />
            </div>
            <div class="form-group">
              <label for="quote-email">Email</label>
              <input type="email" id="quote-email" name="email" required placeholder="you@example.com" />
            </div>
          </div>

          <div class="form-group">
            <label for="quote-phone">Phone</label>
            <input type="tel" id="quote-phone" name="phone" placeholder="(555) 555-5555" />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="quote-client-type">Individual or organization</label>
              <select id="quote-client-type" name="client_type" required>
                <option value="">Select…</option>
                <option value="Individual">Individual</option>
                <option value="Small Business">Small Business</option>
                <option value="Nonprofit">Nonprofit</option>
                <option value="Enterprise or Organization">Enterprise or Organization</option>
              </select>
            </div>
            <div class="form-group">
              <label for="quote-org">Organization name <span class="optional">(if applicable)</span></label>
              <input type="text" id="quote-org" name="organization" placeholder="Organization name" />
            </div>
          </div>

          <div class="form-group">
            <label for="quote-type">Project type</label>
            <select id="quote-type" name="project_type" required>
              <option value="">Select…</option>
              <option value="Website project">Website project</option>
              <option value="Custom software">Custom software</option>
              <option value="Business network project">Business network project</option>
              <option value="Data migration">Data migration</option>
              <option value="Contract IT support">Contract IT support</option>
              <option value="Enterprise services">Enterprise services</option>
              <option value="Large setup">Large setup</option>
              <option value="Nonprofit website or software request">Nonprofit website or software request</option>
              <option value="Other project">Other project</option>
            </select>
          </div>

          <div class="form-group">
            <label for="quote-description">Project description</label>
            <textarea id="quote-description" name="description" rows="4" required placeholder="Describe the project"></textarea>
          </div>

          <div class="form-group">
            <label for="quote-problem">Current problem</label>
            <textarea id="quote-problem" name="current_problem" rows="3" placeholder="What's not working or what's missing?"></textarea>
          </div>

          <div class="form-group">
            <label for="quote-outcome">Desired outcome</label>
            <textarea id="quote-outcome" name="desired_outcome" rows="3" placeholder="What does success look like?"></textarea>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="quote-timeline">Preferred timeline</label>
              <select id="quote-timeline" name="timeline">
                <option value="Flexible">Flexible</option>
                <option value="ASAP">ASAP</option>
                <option value="1–3 months">1–3 months</option>
                <option value="3–6 months">3–6 months</option>
                <option value="6+ months">6+ months</option>
              </select>
            </div>
            <div class="form-group">
              <label for="quote-budget">Budget range</label>
              <select id="quote-budget" name="budget">
                <option value="">Prefer not to say</option>
                <option value="Under $2,500">Under $2,500</option>
                <option value="$2,500 – $10,000">$2,500 – $10,000</option>
                <option value="$10,000 – $25,000">$10,000 – $25,000</option>
                <option value="$25,000+">$25,000+</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="quote-systems">Existing systems</label>
            <textarea id="quote-systems" name="existing_systems" rows="2" placeholder="What tools, platforms, or systems are currently in use?"></textarea>
          </div>

          <div class="form-group">
            <label for="quote-contact-method">Preferred contact method</label>
            <select id="quote-contact-method" name="contact_method">
              <option value="Email">Email</option>
              <option value="Phone">Phone</option>
              <option value="Either">Either</option>
            </select>
          </div>

          <div class="form-group">
            <label for="quote-file">File upload <span class="optional">(optional)</span></label>
            <input type="file" id="quote-file" name="attachment" accept=".pdf,.doc,.docx,.txt,.png,.jpg,.jpeg,.zip" />
          </div>

          <input type="hidden" name="terms_version" value="July 2026" />
          <label class="terms-agreement">
            <input type="checkbox" id="quote-terms-agree" name="terms_agreed" value="Yes" required />
            <span>I have read and agree to the <a href="terms.html" target="_blank" rel="noopener noreferrer" class="text-link">Terms &amp; Agreement</a> and <a href="policies.html" target="_blank" rel="noopener noreferrer" class="text-link">service policies</a>.</span>
          </label>

          <button type="submit" class="btn btn-primary btn-full">Submit quote request</button>
          <p class="sensitive-notice">Please do not include passwords, Social Security numbers, financial records, or other sensitive information.</p>
          <p class="form-note" id="quote-form-note" hidden></p>
        </form>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <div id="site-mobile-actions"></div>

  <script src="js/site-shell.js"></script>


  <script src="js/main.js"></script>
</body>
</html>
